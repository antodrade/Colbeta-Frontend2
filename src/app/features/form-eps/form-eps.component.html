<form class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
  
  <!-- CARD 1: Búsqueda y Validación -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <div class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4 mb-5">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      Búsqueda y Validación
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
      <div>
        <label for="numdocx" class="block text-sm font-semibold text-slate-700 mb-1.5">Número de documento</label>
        <input 
          type="text" 
          id="numdocx"
          name="numdocx"
          [(ngModel)]="formulario.usuario.nidentificacion"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm"
          placeholder="Ingrese número de documento">
      </div>
      
      <div>
        <label for="opciones" class="block text-sm font-semibold text-slate-700 mb-1.5">Nombre de Empresa</label>
        <select 
          id="opciones" 
          name="empresaSelect"
          [(ngModel)]="formulario.empresa.idEmpresa"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
          @for (opcion of opciones2; let i = $index; track opcion) {
            <option [value]="i+1">{{ opcion }}</option>
          } @empty {
            <option disabled>No hay opciones disponibles</option>
          }
        </select>
      </div>

      <div>
        <button 
          id="numdoc"
          type="button"
          (click)="validar()"
          class="w-full inline-flex items-center justify-center px-6 py-2.5 h-[46px] bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-lg shadow-sm transition duration-150 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 cursor-pointer">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Validar Trabajador
        </button>
      </div>
    </div>
  </div>

  <!-- CARD 2: Datos Personales del Trabajador -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <div class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4 mb-5">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      Información Personal del Trabajador
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div>
        <label for="nombre1" class="block text-sm font-semibold text-slate-700 mb-1.5">Primer Nombre</label>
        <input 
          type="text" 
          id="nombre1"
          name="nombre1"
          [(ngModel)]="formulario.usuario.name1"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="nombre2" class="block text-sm font-semibold text-slate-700 mb-1.5">Segundo Nombre</label>
        <input 
          type="text" 
          id="nombre2"
          name="nombre2"
          [(ngModel)]="formulario.usuario.name2"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="apellido1" class="block text-sm font-semibold text-slate-700 mb-1.5">Primer Apellido</label>
        <input 
          type="text" 
          id="apellido1"
          name="apellido1"
          [(ngModel)]="formulario.usuario.lastname1"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="apellido2" class="block text-sm font-semibold text-slate-700 mb-1.5">Segundo Apellido</label>
        <input 
          type="text" 
          id="apellido2"
          name="apellido2"
          [(ngModel)]="formulario.usuario.lastname2"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="tipodoc" class="block text-sm font-semibold text-slate-700 mb-1.5">Tipo de documento</label>
        <input 
          type="text" 
          id="tipodoc"
          name="tipodoc"
          [(ngModel)]="formulario.usuario.tipoDoc"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="sexo" class="block text-sm font-semibold text-slate-700 mb-1.5">Sexo</label>
        <input 
          type="text" 
          id="sexo"
          name="sexo"
          [(ngModel)]="formulario.usuario.sexo"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="fechanac" class="block text-sm font-semibold text-slate-700 mb-1.5">Fecha de nacimiento</label>
        <input 
          type="text" 
          id="fechanac"
          name="fechanac"
          [(ngModel)]="formulario.usuario.fechaNac"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>
    </div>
  </div>

  <!-- CARD 3: Ubicación y Contacto del Trabajador -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <div class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4 mb-5">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
      </svg>
      Ubicación y Contacto del Trabajador
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div>
        <label for="dirUsuario" class="block text-sm font-semibold text-slate-700 mb-1.5">Dirección de residencia</label>
        <input 
          type="text" 
          id="dirUsuario"
          name="dirUsuario"
          [(ngModel)]="formulario.usuario.direccion"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="telUsuario" class="block text-sm font-semibold text-slate-700 mb-1.5">Teléfono fijo</label>
        <input 
          type="text" 
          id="telUsuario"
          name="telUsuario"
          [(ngModel)]="formulario.usuario.telUsuario"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="celular" class="block text-sm font-semibold text-slate-700 mb-1.5">Teléfono celular</label>
        <input 
          type="text" 
          id="celular"
          name="celular"
          [(ngModel)]="formulario.usuario.celUsuario"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="emailUsuario" class="block text-sm font-semibold text-slate-700 mb-1.5">Correo electrónico</label>
        <input 
          type="text" 
          id="emailUsuario"
          name="emailUsuario"
          [(ngModel)]="formulario.usuario.email"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="ciudadUsuario" class="block text-sm font-semibold text-slate-700 mb-1.5">Municipio</label>
        <input 
          type="text" 
          id="ciudadUsuario"
          name="ciudadUsuario"
          [(ngModel)]="formulario.usuario.ciudad"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="depUsuario" class="block text-sm font-semibold text-slate-700 mb-1.5">Departamento</label>
        <input 
          type="text" 
          id="depUsuario"
          name="depUsuario"
          [(ngModel)]="formulario.usuario.departamento"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>
    </div>
  </div>

  <!-- CARD 4: Afiliaciones y Datos Laborales -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <div class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4 mb-5">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      Afiliación y Datos Laborales
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div>
        <label for="fechaIng" class="block text-sm font-semibold text-slate-700 mb-1.5">Fecha de ingreso a la empresa</label>
        <input 
          type="date" 
          id="fechaIng"
          name="fechaIng"
          [(ngModel)]="formulario.fechaIng"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="cargo" class="block text-sm font-semibold text-slate-700 mb-1.5">Cargo</label>
        <input 
          type="text" 
          id="cargo"
          name="cargo"
          [(ngModel)]="formulario.cargo"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="salario" class="block text-sm font-semibold text-slate-700 mb-1.5">IBC (Salario)</label>
        <input 
          type="text" 
          id="salario"
          name="salario"
          [(ngModel)]="formulario.salario"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="ARL" class="block text-sm font-semibold text-slate-700 mb-1.5">ARL</label>
        <input 
          type="text" 
          id="ARL"
          name="ARL"
          [(ngModel)]="formulario.ARL"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="AFP" class="block text-sm font-semibold text-slate-700 mb-1.5">Fondo de Pensiones (AFP)</label>
        <input 
          type="text" 
          id="AFP"
          name="AFP"
          [(ngModel)]="formulario.AFP"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="caja" class="block text-sm font-semibold text-slate-700 mb-1.5">Caja de Compensación</label>
        <input 
          type="text" 
          id="caja"
          name="caja"
          [(ngModel)]="formulario.caja"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>
    </div>
  </div>

  <!-- CARD 5: Datos de la Empresa -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <div class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4 mb-5">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
      Información de la Empresa
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div>
        <label for="tipoDocEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Tipo de Documento Empresa</label>
        <input 
          type="text" 
          id="tipoDocEmpresa"
          name="tipoDocEmpresa"
          [(ngModel)]="formulario.empresa.tipoDoc"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="docEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Número de Documento</label>
        <input 
          type="text" 
          id="docEmpresa"
          name="docEmpresa"
          [(ngModel)]="formulario.empresa.nidentificacion"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="dirEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Dirección</label>
        <input 
          type="text" 
          id="dirEmpresa"
          name="dirEmpresa"
          [(ngModel)]="formulario.empresa.direccion"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="telEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Teléfono fijo Empresa</label>
        <input 
          type="text" 
          id="telEmpresa"
          name="telEmpresa"
          [(ngModel)]="formulario.empresa.telefono"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="emailEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Correo Electrónico</label>
        <input 
          type="text" 
          id="emailEmpresa"
          name="emailEmpresa"
          [(ngModel)]="formulario.empresa.correo"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="ciudadEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Municipio</label>
        <input 
          type="text" 
          id="ciudadEmpresa"
          name="ciudadEmpresa"
          [(ngModel)]="formulario.empresa.municipio"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="depEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Departamento</label>
        <input 
          type="text" 
          id="depEmpresa"
          name="depEmpresa"
          [(ngModel)]="formulario.empresa.departamento"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>
    </div>
  </div>

  <!-- CHECKBOX Y ACCIONES -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pt-4 border-t border-slate-200">
    <div class="flex items-center">
      <input 
        type="checkbox" 
        id="exampleCheck1"
        class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
      <label for="exampleCheck1" class="ml-2.5 text-sm font-medium text-slate-600 cursor-pointer select-none">
        Confirmar datos ingresados
      </label>
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
      <button 
        type="submit" 
        class="inline-flex items-center justify-center px-8 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-lg shadow-sm transition duration-150 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 cursor-pointer">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Guardar Datos
      </button>

      <button 
        type="button"
        (click)="generarPdfconDatos()"
        class="inline-flex items-center justify-center px-8 py-3 bg-slate-800 hover:bg-slate-900 active:bg-slate-950 text-white font-semibold rounded-lg shadow-sm transition duration-150 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 cursor-pointer">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        Generar PDF
      </button>
    </div>
  </div>

  <div class="text-center sm:text-left pt-2 text-slate-500 text-xs italic">
    <p>Complete todos los campos requeridos antes de generar el documento final.</p>
  </div>
</form>
