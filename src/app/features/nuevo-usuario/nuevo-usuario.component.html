<div class="space-y-6 max-w-7xl mx-auto p-2">
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    
    <!-- Encabezado del Formulario -->
    <div class="flex items-center gap-3 border-b border-gray-100 pb-4 mb-6">
      <div class="p-2 bg-blue-50 text-blue-600 rounded-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <div>
        <h2 class="text-xl font-bold text-gray-800">Ingreso de Nuevo Usuario</h2>
        <p class="text-sm text-gray-500">Diligencie los campos requeridos para el registro completo del usuario en la plataforma.</p>
      </div>
    </div>

    <form (ngSubmit)="guardarUsuario()" class="space-y-8">

      <!-- Sección 1: Información Personal -->
      <div>
        <h3 class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          Información Personal
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Tipo Doc -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Documento</label>
            <select name="tipoDoc" [(ngModel)]="usuario.tipoDoc" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm bg-white">
              <option value="">Seleccione...</option>
              <option value="CC">Cédula de Ciudadanía</option>
              <option value="CE">Cédula de Extranjería</option>
              <option value="PAS">Pasaporte</option>
              <option value="TI">Tarjeta de Identidad</option>
            </select>
          </div>

          <!-- N. Identificación -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Número de Documento</label>
            <input type="text" name="nidentificacion" [(ngModel)]="usuario.nidentificacion" placeholder="Ej. 1065123456" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Primer Nombre -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Primer Nombre</label>
            <input type="text" name="name1" [(ngModel)]="usuario.name1" placeholder="Primer nombre" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Segundo Nombre -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Segundo Nombre</label>
            <input type="text" name="name2" [(ngModel)]="usuario.name2" placeholder="Segundo nombre" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Primer Apellido -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Primer Apellido</label>
            <input type="text" name="lastname1" [(ngModel)]="usuario.lastname1" placeholder="Primer apellido" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Segundo Apellido -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Segundo Apellido</label>
            <input type="text" name="lastname2" [(ngModel)]="usuario.lastname2" placeholder="Segundo apellido" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Sexo -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Sexo</label>
            <select name="sexo" [(ngModel)]="usuario.sexo" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm bg-white">
              <option value="">Seleccione...</option>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
            </select>
          </div>

          <!-- Fecha de Nacimiento -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Nacimiento</label>
            <input type="date" name="fechaNac" [(ngModel)]="usuario.fechaNac" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-gray-700">
          </div>
        </div>
      </div>

      <!-- Sección 2: Ubicación y Contacto -->
      <div>
        <h3 class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Ubicación y Contacto
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Departamento -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Departamento</label>
            <input type="text" name="departamento" [(ngModel)]="usuario.departamento" placeholder="Ej. Cesar" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Ciudad -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ciudad</label>
            <input type="text" name="ciudad" [(ngModel)]="usuario.ciudad" placeholder="Ej. Valledupar" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Dirección General -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
            <input type="text" name="direccion" [(ngModel)]="usuario.direccion" placeholder="Ej. Calle 12 # 34-56" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Dirección Residencia -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Dirección de Residencia</label>
            <input type="text" name="dirUsuario" [(ngModel)]="usuario.dirUsuario" placeholder="Dirección de residencia" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Teléfono Usuario -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono Fijo</label>
            <input type="tel" name="telUsuario" [(ngModel)]="usuario.telUsuario" placeholder="Ej. 605 5551234" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Celular Usuario -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono Celular</label>
            <input type="tel" name="celUsuario" [(ngModel)]="usuario.celUsuario" placeholder="Ej. 300 1234567" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Email -->
          <div class="lg:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input type="email" name="email" [(ngModel)]="usuario.email" placeholder="correo@ejemplo.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>
        </div>
      </div>

      <!-- Sección 3: Datos de Salud e Ingreso -->
      <div>
        <h3 class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0V5" />
          </svg>
          Datos de Salud e Ingreso
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- EPS -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">EPS</label>
            <input type="text" name="eps" [(ngModel)]="usuario.eps" placeholder="Ej. Sanitas, Nueva EPS, Sura" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <!-- Fecha de Ingreso -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Ingreso</label>
            <input type="date" name="fechaIngreso" [(ngModel)]="usuario.fechaIngreso" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-gray-700">
          </div>
        </div>
      </div>

      <!-- Sección 4: Carga de Firma -->
      <div>
        <h3 class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
          </svg>
          Documentos y Firma
        </h3>

        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Imagen de la firma</label>
            <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-blue-400 transition bg-gray-50/50">
              <div class="space-y-1 text-center">
                <svg class="mx-auto h-10 w-10 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                  <path d="M28 8H12a4 4 0 00-4 4v20a4 4 0 004 4h24a4 4 0 004-4V20L28 8z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M28 8v12h12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="flex text-sm text-gray-600 justify-center">
                  <label for="urlFirma" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500 px-2 py-1 border border-gray-200">
                    <span>Seleccionar imagen</span>
                    <input id="urlFirma" type="file" (change)="onFileSelected($event)" accept="image/png, image/jpeg, image/webp" class="sr-only">
                  </label>
                  <p class="pl-1 self-center">o arrastrar aquí</p>
                </div>
                <p class="text-xs text-gray-500">Formatos permitidos: PNG, JPG o WEBP (máx. 2MB)</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="flex justify-end gap-3 pt-6 border-t border-gray-100">
        <button type="button" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
          Cancelar
        </button>
        <button type="submit" class="px-6 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition flex items-center gap-2 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          <span>Guardar Usuario</span>
        </button>
      </div>

    </form>
  </div>
</div>
