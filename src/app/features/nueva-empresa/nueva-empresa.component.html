<form (ngSubmit)="guardarEmpresa()" class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
  
  <!-- CARD 1: Información General de la Empresa -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <div class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4 mb-5">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
      Información de la Empresa
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div>
        <label for="nombreEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Nombre de la Empresa</label>
        <input 
          type="text" 
          id="nombreEmpresa"
          name="nombreEmpresa"
          [(ngModel)]="empresa.nombre"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm"
          placeholder="Nombre comercial">
      </div>

      <div>
        <label for="tipoDoc" class="block text-sm font-semibold text-slate-700 mb-1.5">Tipo de Documento</label>
        <input 
          type="text" 
          id="tipoDoc"
          name="tipoDoc"
          [(ngModel)]="empresa.tipoDoc"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm"
          placeholder="NIT, RUT, etc.">
      </div>

      <div>
        <label for="nidentificacion" class="block text-sm font-semibold text-slate-700 mb-1.5">Número de Identificación</label>
        <input 
          type="text" 
          id="nidentificacion"
          name="nidentificacion"
          [(ngModel)]="empresa.nidentificacion"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm"
          placeholder="Número sin dígito de verificación">
      </div>

      <div>
        <label for="correoEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Correo Electrónico</label>
        <input 
          type="email" 
          id="correoEmpresa"
          name="correoEmpresa"
          [(ngModel)]="empresa.correo"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm"
          placeholder="empresa@ejemplo.com">
      </div>

      <div>
        <label for="telefonoEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Teléfono de Contacto</label>
        <input 
          type="text" 
          id="telefonoEmpresa"
          name="telefonoEmpresa"
          [(ngModel)]="empresa.telefono"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm"
          placeholder="Fijo o celular">
      </div>
    </div>
  </div>

  <!-- CARD 2: Ubicación de la Empresa -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <div class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4 mb-5">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      Ubicación y Dirección
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div>
        <label for="departamento" class="block text-sm font-semibold text-slate-700 mb-1.5">Departamento</label>
        <input 
          type="text" 
          id="departamento"
          name="departamento"
          [(ngModel)]="empresa.departamento"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="municipio" class="block text-sm font-semibold text-slate-700 mb-1.5">Municipio</label>
        <input 
          type="text" 
          id="municipio"
          name="municipio"
          [(ngModel)]="empresa.municipio"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="direccionEmpresa" class="block text-sm font-semibold text-slate-700 mb-1.5">Dirección</label>
        <input 
          type="text" 
          id="direccionEmpresa"
          name="direccionEmpresa"
          [(ngModel)]="empresa.direccion"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>
    </div>
  </div>

  <!-- CARD 3: Información del Responsable -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <div class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4 mb-5">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      Información del Responsable
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div>
        <label for="telRes" class="block text-sm font-semibold text-slate-700 mb-1.5">Teléfono Fijo</label>
        <input 
          type="text" 
          id="telRes"
          name="telRes"
          [(ngModel)]="usuario.telUsuario"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="celRes" class="block text-sm font-semibold text-slate-700 mb-1.5">Celular</label>
        <input 
          type="text" 
          id="celRes"
          name="celRes"
          [(ngModel)]="usuario.celUsuario"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div class="md:col-span-2">
        <label for="emailRes" class="block text-sm font-semibold text-slate-700 mb-1.5">Correo Electrónico</label>
        <input 
          type="email" 
          id="emailRes"
          name="emailRes"
          [(ngModel)]="usuario.email"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div class="md:col-span-2">
        <label for="dirRes" class="block text-sm font-semibold text-slate-700 mb-1.5">Dirección de Contacto</label>
        <input 
          type="text" 
          id="dirRes"
          name="dirRes"
          [(ngModel)]="usuario.direccion"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="ciudadRes" class="block text-sm font-semibold text-slate-700 mb-1.5">Ciudad</label>
        <select 
          id="ciudadRes" 
          name="ciudadRes"
          [(ngModel)]="usuario.ciudad"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
          <option value="">Seleccione...</option>
          <option value="Barranquilla">Barranquilla</option>
          <option value="Valledupar">Valledupar</option>
          <option value="Bogota">Bogotá</option>
        </select>
      </div>

      <div>
        <label for="fechaIngRes" class="block text-sm font-semibold text-slate-700 mb-1.5">Fecha de Ingreso</label>
        <input 
          type="date" 
          id="fechaIngRes"
          name="fechaIngRes"
          [(ngModel)]="usuario.fechaIngreso"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
      </div>

      <div>
        <label for="epsRes" class="block text-sm font-semibold text-slate-700 mb-1.5">EPS</label>
        <select 
          id="epsRes" 
          name="epsRes"
          [(ngModel)]="usuario.eps"
          class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all duration-150 shadow-sm text-sm">
          <option value="">Seleccione...</option>
          <option value="Sura">Sura</option>
          <option value="Sanitas">Sanitas</option>
          <option value="Saludtotal">Salud Total</option>
        </select>
      </div>
    </div>
  </div>

  <!-- CARD 4: Firma y Otros Datos -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <div class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4 mb-5">
      <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
      </svg>
      Firma del Responsable
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
      <div class="space-y-4">
        <label class="block text-sm font-semibold text-slate-700">Imagen de Firma (PNG/JPG)</label>
        <div class="flex items-center gap-4">
          <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)">
          <button 
            type="button" 
            (click)="fileInput.click()"
            class="inline-flex items-center px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-150">
            <svg class="w-4 h-4 mr-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            Seleccionar archivo
          </button>
          <span class="text-sm text-slate-500 italic">
            {{ fileName ? fileName : 'Sin archivo seleccionado' }}
          </span>
        </div>
      </div>

      <div class="flex items-center h-full pt-6">
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="cotizaPension" name="cotizaPension" class="sr-only peer">
          <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
          <span class="ml-3 text-sm font-semibold text-slate-700">Cotiza a Pensión</span>
        </label>
      </div>
    </div>
  </div>

  <!-- ACCIONES -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pt-4 border-t border-slate-200">
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
      <button 
        type="submit" 
        class="inline-flex items-center justify-center px-8 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-lg shadow-sm transition duration-150 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 cursor-pointer">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Guardar Empresa
      </button>

      <button 
        type="button"
        (click)="onReset3()"
        class="inline-flex items-center justify-center px-8 py-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-lg shadow-sm transition duration-150 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 cursor-pointer">
        Limpiar
      </button>
    </div>

    <button 
      type="button"
      routerLink="/empresas"
      class="inline-flex items-center justify-center px-6 py-3 bg-slate-800 hover:bg-slate-900 active:bg-slate-950 text-white font-semibold rounded-lg shadow-sm transition duration-150 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 cursor-pointer">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
      Listado de Empresas
    </button>
  </div>
</form>
