<h3 class="text-lg font-bold text-slate-800 tracking-tight mb-2 flex items-center gap-2">
  <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
  </svg>
  Escritura en Hoja de Cálculo
</h3>
<p class="text-sm text-slate-500 mb-4">Introduce contenido estructurado (ej. formato JSON) para generar y descargar un nuevo archivo de Excel.</p>

<div class="space-y-4">
  <div>
    <textarea
      class="w-full min-h-[100px] border border-slate-200 rounded-xl p-3 bg-slate-50 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200 resize-y font-mono"
      placeholder='[{"Nombre": "Juan", "Edad": 30}]'
      [(ngModel)]="contentString"
    ></textarea>
  </div>
  <div class="flex justify-end">
    <button
      type="button"
      class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm transition-colors duration-200"
      (click)="generateFile()"
      [disabled]="!contentString"
    >
      Generar Fichero
    </button>
  </div>
</div>
