<h3 class="text-lg font-bold text-slate-800 tracking-tight mb-2 flex items-center gap-2">
  <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
  </svg>
  Lectura de Hoja de Cálculo
</h3>
<p class="text-sm text-slate-500 mb-4">Carga un archivo en formato Excel (.xlsx) para procesar y cargar los datos de manera automática.</p>

<div class="space-y-4">
  <input
    type="file"
    accept=".xlsx, .xls"
    class="block w-full text-sm text-slate-500
      file:mr-4 file:py-2 file:px-4
      file:rounded-xl file:border-0
      file:text-sm file:font-semibold
      file:bg-blue-50 file:text-blue-700
      hover:file:bg-blue-100
      border border-slate-200 rounded-xl p-2 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
    (change)="incomingFile($event)"
  />
  <div class="flex justify-end">
    <button
      type="button"
      class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm transition-colors duration-200"
      (click)="processFile()"
      [disabled]="!target"
    >
      Procesar Archivo
    </button>
  </div>
</div>
